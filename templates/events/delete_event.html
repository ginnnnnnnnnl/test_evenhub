{% extends "base.html" %}
{% block content %}
<h1>Delete Event</h1>

<!-- TODO: Show the event title and ask for confirmation.
     Use a POST form and {% csrf_token %}.
-->
<form method="post" action="{% url 'events:delete_event' event.id %}">
     {% csrf_token %}
     <p>
          Are you sure to delete {{ event.title }}?
     </p>
     <button type="submit">Delete</button>
</form>
     
{% endblock %}
