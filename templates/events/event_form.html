{% extends "base.html" %}
{% block content %}
<h1>Event Form</h1>

<!-- TODO: Create a POST form for:
     title, description, location, event_date,
     category, status, capacity.
     Include CSRF protection.
     Populate category choices from the database.
-->
<form method="post" action="{% url 'events:create_event' %}">
     {% csrf_token %}
     <label for="title">Title:</label>
     <input type="text" name="title" id="title" required><br>

     <label for="description" >Description:</label>
     <textarea name="description" id="description" required></textarea><br>

     <label for="location">Location:</label>
     <input type="text" name="location" id="location" required><br>

     <label for="event_date">Event Date:</label>
     <input type="datetime-local" name="event_date" id="event_date" required>

     <label for="category">Category:</label>
     <select name="category" id="category" required>
           {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
               </option>
           {% endfor %}
     </select><br>

     <label for="status">Status:</label>
     <select name="status" id="status" required>
          <option value="upcoming">Upcoming</option>
          <option value="ongoing">Ongoing</option>
          <option value="finished">Finished</option>
     </select><br>

     <label for="capacity">Capacity:</label>
     <input type="number" name="capacity" id="capacity" required><br>

     <button type="submit">Create Event</button>
</form>
{% endblock %}
